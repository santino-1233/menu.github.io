<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-contenido">
      <p class="hero-script">Hecho a mano, todos los días</p>
      <div class="ornamento" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 24 24" class="corazon"><path d="M12 21s-7.5-4.6-9.6-9.1C1 8.5 3 5 6.5 5c2 0 3.5 1.2 5.5 3 2-1.8 3.5-3 5.5-3C21 5 23 8.5 21.6 11.9 19.5 16.4 12 21 12 21z"/></svg>
        <span></span>
      </div>
      <h1>Nuestro Menú</h1>
      <p id="estado" class="estado">Cargando menú…</p>
    </div>
  </header>

  <nav id="navegacion" class="navegacion" aria-label="Categorías"></nav>

  <main id="menu" class="menu"></main>

  <footer class="pie">
    <div class="ornamento" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 24 24" class="corazon"><path d="M12 21s-7.5-4.6-9.6-9.1C1 8.5 3 5 6.5 5c2 0 3.5 1.2 5.5 3 2-1.8 3.5-3 5.5-3C21 5 23 8.5 21.6 11.9 19.5 16.4 12 21 12 21z"/></svg>
      <span></span>
    </div>
    <p>Precios en pesos argentinos</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
